name: Finish map hardening

on:
  push:
    branches:
      - agent/ui-timing-usability-hardening

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[map-hardening-finished]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-timing-usability-hardening
          fetch-depth: 0

      - name: Apply final map changes
        run: |
          python - <<'PY'
          from pathlib import Path

          map_path = Path('src/components/MapView.tsx')
          text = map_path.read_text()
          old = """    map.addControl(new maplibregl.NavigationControl(), 'top-right');
              map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');


              let mapLoaded = false;
          """
          new = """    map.addControl(new maplibregl.NavigationControl(), 'top-right');
              map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: 'metric' }), 'bottom-left');
              map.on('dragstart', () => {
                if (!followSelectedRef.current) return;
                followSelectedRef.current = false;
                setFollowSelected(false);
              });

              let mapLoaded = false;
          """
          if old not in text:
              raise SystemExit('Map control insertion point not found')
          text = text.replace(old, new, 1)

          old = """      if (state.drones !== previous.drones) {
                  const droneIds = new Set([...Object.keys(state.drones), ...Object.keys(previous.drones)]);
                  droneIds.forEach((droneId) => {
                    if (state.drones[droneId] !== previous.drones[droneId]) pendingDroneIds.add(droneId);
                  });
                  droneSourcesDirty = true;
                }
          """
          new = """      if (state.drones !== previous.drones) {
                  const droneIds = new Set([...Object.keys(state.drones), ...Object.keys(previous.drones)]);
                  droneIds.forEach((droneId) => {
                    const currentDrone = state.drones[droneId];
                    const previousDrone = previous.drones[droneId];
                    if (currentDrone !== previousDrone) {
                      pendingDroneIds.add(droneId);
                      if (droneMotionChanged(currentDrone, previousDrone)) droneSourcesDirty = true;
                    }
                  });
                }
          """
          if old not in text:
              raise SystemExit('Drone subscription insertion point not found')
          text = text.replace(old, new, 1)

          marker = "function registerPopupLayer("
          helper = """function droneMotionChanged(current: Drone | undefined, previous: Drone | undefined): boolean {
            if (!current || !previous) return current !== previous;
            return current.position?.latitude !== previous.position?.latitude
              || current.position?.longitude !== previous.position?.longitude
              || current.position?.altitude !== previous.position?.altitude
              || current.heading !== previous.heading
              || current.course !== previous.course
              || current.groundSpeed !== previous.groundSpeed
              || current.climbRate !== previous.climbRate
              || current.stale !== previous.stale
              || current.symbolSet !== previous.symbolSet
              || current.twin?.vehicleClass !== previous.twin?.vehicleClass;
          }

          """
          if marker not in text:
              raise SystemExit('Popup function marker not found')
          text = text.replace(marker, helper + marker, 1)
          map_path.write_text(text)

          list_path = Path('src/components/DroneList.tsx')
          text = list_path.read_text()
          old = """          <Chip size=\"small\" label={liveState} color={liveState === 'LIVE' ? 'success' : liveState === 'STALE' ? 'warning' : 'default'} />
          """
          new = """          <Chip
                    size=\"small\"
                    label={liveState === 'KNOWN' ? liveState : `${liveState} ${formatAge(now - row.lastSeen)}`}
                    color={liveState === 'LIVE' ? 'success' : liveState === 'STALE' ? 'warning' : 'default'}
                  />
          """
          if old not in text:
              raise SystemExit('Telemetry chip insertion point not found')
          text = text.replace(old, new, 1)
          marker = "function formatHeading(value: number): string {"
          helper = """function formatAge(milliseconds: number): string {
            const seconds = Math.max(0, Math.floor(milliseconds / 1_000));
            if (seconds < 60) return `${seconds}s`;
            const minutes = Math.floor(seconds / 60);
            return minutes < 60 ? `${minutes}m` : `${Math.floor(minutes / 60)}h`;
          }

          """
          if marker not in text:
              raise SystemExit('Heading function marker not found')
          text = text.replace(marker, helper + marker, 1)
          list_path.write_text(text)
          PY

      - name: Commit final map changes
        run: |
          rm -f .github/workflows/finish-map-hardening.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish map timing and freshness behaviour [map-hardening-finished]"
          git push origin HEAD:agent/ui-timing-usability-hardening
