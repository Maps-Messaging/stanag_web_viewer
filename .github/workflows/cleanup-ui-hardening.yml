name: Cleanup UI hardening branch

on:
  push:
    branches:
      - agent/ui-timing-usability-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[ui-hardening-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-timing-usability-hardening
          fetch-depth: 0

      - name: Remove generated files
        run: |
          git rm -r --cached --ignore-unmatch node_modules dist
          git rm --cached --ignore-unmatch tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          rm -rf node_modules dist
          rm -f tsconfig.app.tsbuildinfo tsconfig.node.tsbuildinfo
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          *.tsbuildinfo
          .DS_Store
          EOF

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-ui-hardening.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated dependencies from UI hardening [ui-hardening-clean]"
          git push origin HEAD:agent/ui-timing-usability-hardening
